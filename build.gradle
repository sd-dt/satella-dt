plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
}

dependencies {
    // MC 26.2 已不再混淆，Loom 免 mappings 直接编译（官方名 = 运行时名）
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // MaLiLib 是运行期硬依赖（fabric.mod.json: depends.malilib）
    implementation "maven.modrinth:malilib:${project.malilib_version}"

    // 仅编译期：Mod Menu 配置入口
    compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"

    // 仅编译期：Item Scroller 残留合成兼容层（mixin/itemscroller + ResidualCrafting）
    compileOnly "maven.modrinth:item-scroller:${project.itemscroller_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand(["version": project.version])
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
